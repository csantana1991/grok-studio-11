<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAD ATLAS · Board Studio</title>
<style>
  :root {
    --ink: #0f172a; --dim: #64748b; --line: #e2e8f0; --panel: #ffffff;
    --bg: #f8fafc; --green: #047857; --green-soft: #ecfdf5; --blue: #1d4ed8;
    --amber: #b45309; --red: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { font-weight: 800; letter-spacing: .1em; color: var(--green); }
  .brand span { color: var(--ink); font-weight: 600; letter-spacing: 0; }
  header a {
    margin-left: auto; text-decoration: none; color: var(--blue);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px;
  }
  header a + a { margin-left: 8px; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 64px; }

  .atlas-bar { display: flex; gap: 8px; align-items: stretch; }
  .atlas-field { position: relative; flex: 1; }
  .atlas-field input {
    width: 100%; padding: 12px 14px; font-size: 15px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  .atlas-field input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .atlas-sugg {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(15,23,42,.12); padding: 4px; display: flex; flex-wrap: wrap; gap: 4px;
  }
  .atlas-sugg button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .atlas-sugg button:hover { border-color: var(--green); color: var(--green); }
  .atlas-go {
    border: 1px solid var(--green); background: var(--green-soft); color: var(--green);
    font-weight: 700; letter-spacing: .08em; border-radius: 10px; padding: 0 18px; cursor: pointer;
  }

  .atlas-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .atlas-source {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--dim);
  }
  .atlas-source.on { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }

  .atlas-player {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .atlas-player button {
    border: 1px solid var(--blue); background: #eff6ff; color: var(--blue);
    border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer;
  }
  .atlas-player label { font-size: 13px; color: var(--dim); }
  .atlas-now { font-size: 13px; color: var(--dim); }

  .atlas-notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px;
    background: #fffbeb; border: 1px solid #fde68a; color: var(--amber); font-size: 13px; }
  .atlas-error { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px;
    background: #fef2f2; border: 1px solid #fecaca; color: var(--red); font-size: 13px; }
  .atlas-status { margin-top: 12px; font-size: 13px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .atlas-prov { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .atlas-prov.error { border-color: #fecaca; color: var(--red); }
  .atlas-prov.ok { border-color: #a7f3d0; color: var(--green); }
  .atlas-prov.disabled { opacity: .6; }

  .atlas-grid {
    margin-top: 14px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .atlas-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .atlas-card.reading { border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe; }
  .atlas-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .atlas-kind { background: #eff6ff; color: var(--blue); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  .atlas-mod, .atlas-src { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--dim); }
  .atlas-play { margin-left: auto; border: 1px solid var(--line); background: var(--bg);
    border-radius: 999px; padding: 2px 10px; font-size: 11px; cursor: pointer; color: var(--dim); }
  .atlas-play:hover { border-color: var(--blue); color: var(--blue); }
  .atlas-figure { position: relative; }
  .atlas-figure img { width: 100%; height: 190px; object-fit: contain;
    background: #0b1220; border-radius: 8px; border: 1px solid var(--line); }
  .atlas-nofig { height: 90px; display: grid; place-items: center; border: 1px dashed var(--line);
    border-radius: 8px; color: var(--dim); font-size: 12px; text-align: center; padding: 8px; }
  .atlas-card h3 { margin: 2px 0 0; font-size: 14px; line-height: 1.35; }
  .atlas-desc { margin: 0; font-size: 12px; color: var(--dim);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .atlas-lic { margin: 0; font-size: 11px; color: var(--dim); }
  .atlas-actions { margin-top: auto; display: flex; gap: 10px; padding-top: 4px; }
  .atlas-actions a { font-size: 12px; color: var(--blue); text-decoration: none; }
  .atlas-actions a:hover { text-decoration: underline; }
  .atlas-empty { color: var(--dim); }
  .atlas-foot { margin-top: 22px; font-size: 12px; color: var(--dim); max-width: 70ch; }
</style>
</head>
<body>
<header>
  <span class="brand">RAD ATLAS <span>· open radiology search</span></span>
  <a href="./NucMed-Board-Studio.html">← Board Studio</a>
  <a href="/">RAD REVIEW ULTIMATE</a>
</header>
<main id="atlas-root"></main>
<script src="./radatlas.js" defer></script>
<script src="./qa-agent.js" defer></script>
</body>
</html>
