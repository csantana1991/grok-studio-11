<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Board Studio</title></head>
<body>
<script>

    .replace("const src = this.clipSrc();\n    if (!v || !src) return;", "const src = this.clipSrc();\n    var mod = (typeof currentModule === \"function\") ? currentModule() : null;\n    var protocol = mod && /protocol/i.test((mod.id || \"\") + \" \" + (mod.title || \"\"));\n    if (protocol || !v || !src) { try { var pb = document.getElementById(\"playBtn\"); if (pb) pb.click(); } catch (err) {} return; }")

    + "body.medb-full #modStrip .mod-row{min-height:46px !important;gap:4px !important}"
    + "body.medb-full #modStrip img{width:60px !important;height:44px !important}"
    + ".app,.main,.work,.stage{min-width:0 !important;max-width:100% !important}"
    + ".media-row{display:flex !important;flex-direction:column !important;width:100% !important;min-width:0 !important;overflow:visible !important;grid-template-columns:minmax(0,1fr) !important}"
    + ".vid-split,#colSplit{display:none !important}"
    + ".vid-panel,.vid-panel.is-max{display:flex !important;position:relative !important;inset:auto !important;left:auto !important;right:auto !important;top:auto !important;bottom:auto !important;width:100% !important;max-width:100% !important;height:auto !important;min-height:140px !important;max-height:36vh !important;overflow:hidden !important;z-index:1 !important}"
    + ".script{width:100% !important;min-width:0 !important;max-width:100% !important}"
    + ".script img,.lesson-figs img,#lessonFigMain{max-width:100% !important;height:auto !important;object-fit:contain !important}"
    + ".stage>.pager,body.lesson-audio .stage>.pager{position:relative !important;left:auto !important;right:auto !important;bottom:auto !important;width:auto !important;z-index:6;display:flex;flex-wrap:wrap;gap:8px}"
    + "#playerDock{position:relative !important;width:100% !important;left:auto !important;right:auto !important;z-index:5}"
    + "#playerDock .player-row{position:relative;z-index:30}"
    + "#winBar{position:relative !important;left:auto !important;width:100% !important;max-width:100% !important}"
    + "body:not(.nav-open) #sidebar{display:none !important}"
    + "body.nav-open #sidebar{display:flex !important;position:fixed !important;z-index:80 !important;inset:0 auto 0 0 !important;width:min(88vw,340px) !important;height:100dvh !important;background:#fff}"
    + "body .app,body.nav-min .app,body.nav-max .app{grid-template-columns:minmax(0,1fr) !important}"
    + ".menu-btn{display:grid !important}"
    + "html,body{height:100%;overflow:hidden}"
    + ".app{height:100dvh !important;max-height:100dvh !important;overflow:hidden !important;display:flex !important;flex-direction:column !important}"
    + ".main{flex:1 1 auto !important;min-height:0 !important;height:auto !important;display:flex !important;flex-direction:column !important;overflow:hidden !important}"
    + ".work{flex:1 1 auto !important;min-height:0 !important;overflow:hidden !important}"
    + ".stage{flex:1 1 auto !important;min-height:0 !important;height:auto !important;max-height:100% !important;overflow:auto !important}"
    + "#winBar,#playerDock{flex:0 0 auto !important}"
    + "body.atlas-open .work{display:flex !important;flex-direction:column !important}"

    + "</style>";

  try {
    var code = await (await fetch("/studio/med-join.js")).text();
    if (code && code.indexOf("function harvest") >= 0) join = "<script>" + code + "</" + "script>";
  } catch (e) {}
  html = html.replace("</body>", tail + join + "<script id=\"medFitStable\">(function(){function fit(){if(!document.body.classList.contains('medb-full'))return;var frame=document.getElementById('mbFrame');if(!frame)return;var doc;try{doc=frame.contentDocument;}catch(e){return;}if(!doc||!doc.head)return;var style=doc.getElementById('medFitBox');if(!style){style=doc.createElement('style');style.id='medFitBox';doc.head.appendChild(style);}style.textContent='.studio-rail{display:none!important}.studio-shell{padding-left:0!important}.learning-grid{display:block!important}.media-player,.player-column{overflow:visible!important;width:100%!important}.player-surface{width:min(100%,calc((100vh - 170px) * 1.7778))!important;max-height:calc(100vh - 170px)!important;aspect-ratio:16/9!important;height:auto!important;position:relative!important;overflow:hidden!important}.youtube-mount,.youtube-mount iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}.player-caption{overflow:visible!important}';}setInterval(fit,800);fit();})();</" + "script></body>");
  document.open(); document.write(html); document.close();
})();
</script>

</html>
